<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тоторо говорит...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Caveat:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a2f1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden; user-select: none;
  }
  h1 {
    font-family: 'Caveat', cursive;
    color: #c8e6b2; font-size: 1.8rem;
    margin-bottom: 12px; text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    animation: floatTitle 3s ease-in-out infinite;
  }
  @keyframes floatTitle {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .subtitle {
    color: #8fba78; font-size: 0.85rem;
    margin-bottom: 18px; text-align: center; opacity: 0.85;
  }
  .scene-wrapper {
    position: relative; width: 700px; height: 380px;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .scene-bg {
    width: 100%; height: 100%; object-fit: cover;
    display: block; pointer-events: none;
  }
  .belly-zone {
    position: absolute;
    left: 50%; top: 35%;
    transform: translate(-60%, 0);
    width: 230px; height: 160px;
    border-radius: 50% 50% 60% 60% / 40% 40% 70% 70%;
    cursor: pointer; z-index: 10;
    transition: transform 0.15s;
    /* background: rgba(255,0,0,0.2); */
  }
  .belly-zone.active {
    transform: translate(-60%, 0) scale(1.04);
  }
  .bubble {
    position: absolute;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(255,253,235,0.97);
    border: 3px solid #7db87d; border-radius: 24px;
    padding: 22px 30px; max-width: 320px;
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 1.55rem; font-weight: 700; color: #2d5a27;
    line-height: 1.4;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 6px rgba(125,184,125,0.15);
    z-index: 50; pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s;
    opacity: 0;
  }
  .bubble.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .bubble::after {
    content: ''; position: absolute;
    bottom: -18px; left: 50%; transform: translateX(-50%);
    border: 10px solid transparent; border-top-color: #7db87d;
  }
  .characters-tray {
    display: flex; gap: 18px; margin-top: 18px;
    align-items: flex-end; justify-content: center; flex-wrap: wrap;
  }
  .char {
    width: 64px; height: 64px; cursor: grab;
    transition: transform 0.2s, filter 0.2s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    font-size: 52px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    z-index: 100; touch-action: none;
  }
  .char:hover { transform: scale(1.15) translateY(-4px); }
  .char:active { cursor: grabbing; }
  .char-label {
    font-family: 'Nunito', sans-serif;
    font-size: 0.6rem; color: #8fba78;
    text-align: center; margin-top: 4px;
  }
  .char-wrap { display: flex; flex-direction: column; align-items: center; }
  .sparkle {
    position: fixed; width: 9px; height: 9px;
    border-radius: 50%; pointer-events: none; z-index: 9998;
    animation: sparkleAnim 0.7s ease-out forwards;
  }
  @keyframes sparkleAnim {
    0% { transform: scale(0) translate(0,0); opacity: 1; }
    100% { transform: scale(1) translate(var(--dx), var(--dy)); opacity: 0; }
  }
  .counter {
    margin-top: 12px; color: #8fba78;
    font-family: 'Caveat', cursive; font-size: 1rem; opacity: 0.8;
  }
  @keyframes jiggle {
    0%,100% { transform: scale(1) rotate(0deg); }
    20% { transform: scale(1.02) rotate(-2deg); }
    40% { transform: scale(1.04) rotate(2deg); }
    60% { transform: scale(1.02) rotate(-1.5deg); }
    80% { transform: scale(1.01) rotate(1deg); }
  }
  .scene-wrapper.jiggle { animation: jiggle 0.5s ease; }
  .leaf {
    position: fixed; font-size: 1.1rem; pointer-events: none;
    animation: leafFall linear forwards; z-index: 1; opacity: 0.5;
  }
  @keyframes leafFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity:0.5; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }
  .drop-hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem; font-family: 'Nunito', sans-serif;
    pointer-events: none;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }
</style>
</head>

  <div class="belly-zone" id="bellyZone"></div>
  <div class="bubble" id="bubble"><span id="bubbleText"></span></div>
  <div class="drop-hint">👇 Опусти сюда персонажа</div>
</div>

<div class="characters-tray" id="tray">
  <div class="char-wrap">
    <div class="char" id="c1">🐾</div>
    <div class="char-label">Маленький Тоторо</div>
  </div>
  <div class="char-wrap">
    <div class="char" id="c2">🍃</div>
    <div class="char-label">Листик</div>
  </div>
  <div class="char-wrap">
    <div class="char" id="c3">⭐</div>
    <div class="char-label">Звёздочка</div>
  </div>
  <div class="char-wrap">
    <div class="char" id="c4">🌸</div>
    <div class="char-label">Сацуки</div>
  </div>
  <div class="char-wrap">
    <div class="char" id="c5">🐱</div>
    <div class="char-label">Котобус</div>
  </div>
</div>

<div class="counter" id="counter">Ещё 7 комплиментов ждут... 🌱</div>

<script>
const compliments = [
  "Ты иногда как колючка,\nно очень добрая 🌵💚",
  "Ты всем помогаешь 🌟",
  "Ты такая креативная ✨🎨",
  "Ты так много умеешь 🙌",
  "Ты хорошо поддерживаешь 🤗",
  "Ты хорошая коллега 💛",
  "Ты просто очень хорошая!!!! 🌸🌸🌸"
];

let shown = [];
let bubbleTimeout = null;
const belly = document.getElementById('bellyZone');
const bubble = document.getElementById('bubble');
const bubbleText = document.getElementById('bubbleText');
const scene = document.getElementById('scene');
const counter = document.getElementById('counter');

function updateCounter() {
  const left = compliments.length - shown.length;
  counter.textContent = left === 0
    ? '💚 Все комплименты раскрыты! Тоторо гордится тобой!'
    : `Ещё ${left} комплимент${left===1?'':'а'} ждут... 🌱`;
}

function showCompliment(x, y) {
  if (shown.length >= compliments.length) shown = [];
  const remaining = compliments.map((c,i)=>i).filter(i=>!shown.includes(i));
  const idx = remaining[Math.floor(Math.random()*remaining.length)];
  shown.push(idx);
  bubbleText.textContent = compliments[idx];
  bubble.classList.add('show');
  scene.classList.add('jiggle');
  spawnSparkles(x, y);
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(()=>bubble.classList.remove('show'), 3500);
  setTimeout(()=>scene.classList.remove('jiggle'), 500);
  updateCounter();
}

belly.addEventListener('click', e => showCompliment(e.clientX, e.clientY));

function spawnSparkles(x, y) {
  const colors = ['#ffe066','#7db87d','#ff9eb5','#a8d8ea','#fff','#ffd700'];
  for (let i=0; i<14; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (i/14)*2*Math.PI;
    const dist = 30+Math.random()*50;
    s.style.cssText = `left:${x-4}px;top:${y-4}px;background:${colors[i%colors.length]};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 700);
  }
}

let dragClone = null, dragEl = null;

document.querySelectorAll('.char').forEach(el => {
  el.addEventListener('mousedown', e => { e.preventDefault(); dragEl=el; makeClone(e.clientX,e.clientY); });
  el.addEventListener('touchstart', e => { e.preventDefault(); dragEl=el; makeClone(e.touches[0].clientX,e.touches[0].clientY); }, {passive:false});
});

function makeClone(x,y) {
  dragClone = dragEl.cloneNode(true);
  Object.assign(dragClone.style, {
    position:'fixed', pointerEvents:'none', zIndex:9999,
    fontSize:'56px', width:'64px', height:'64px',
    display:'flex', alignItems:'center', justifyContent:'center',
    transform:'scale(1.3)', filter:'drop-shadow(0 8px 20px rgba(0,0,0,0.5))',
    left:(x-32)+'px', top:(y-40)+'px', transition:'none'
  });
  document.body.appendChild(dragClone);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMoveT, {passive:false});
  document.addEventListener('touchend', onUpT);
}

function onMove(e) {
  if(!dragClone) return;
  dragClone.style.left=(e.clientX-32)+'px';
  dragClone.style.top=(e.clientY-40)+'px';
  checkHover(e.clientX,e.clientY);
}
function onMoveT(e) {
  e.preventDefault();
  if(!dragClone) return;
  dragClone.style.left=(e.touches[0].clientX-32)+'px';
  dragClone.style.top=(e.touches[0].clientY-40)+'px';
  checkHover(e.touches[0].clientX,e.touches[0].clientY);
}
function checkHover(x,y) {
  const r=belly.getBoundingClientRect();
  belly.classList.toggle('active', x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom);
}
function onUp(e) {
  document.removeEventListener('mousemove',onMove);
  document.removeEventListener('mouseup',onUp);
  drop(e.clientX,e.clientY);
}
function onUpT(e) {
  document.removeEventListener('touchmove',onMoveT);
  document.removeEventListener('touchend',onUpT);
  drop(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
}
function drop(x,y) {
  if(dragClone){ dragClone.remove(); dragClone=null; }
  belly.classList.remove('active');
  const r=belly.getBoundingClientRect();
  if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) {
    showCompliment(x,y);
    document.querySelectorAll('.char').forEach(c=>{
      c.style.transition='transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
      c.style.transform='scale(1.2) translateY(-8px)';
      setTimeout(()=>c.style.transform='',300);
    });
  }
  dragEl=null;
}

function spawnLeaf() {
  const l=document.createElement('div');
  l.className='leaf';
  l.textContent=['🍃','🌿','🍀'][Math.floor(Math.random()*3)];
  l.style.left=Math.random()*100+'vw';
  l.style.animationDuration=(5+Math.random()*7)+'s';
  document.body.appendChild(l);
  setTimeout(()=>l.remove(),12000);
}
setInterval(spawnLeaf,2000);
updateCounter();
</script>
</body>
</html>
